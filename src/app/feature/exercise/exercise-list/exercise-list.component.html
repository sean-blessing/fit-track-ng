<app-menu></app-menu>
<div class="p-4">
  <section class="heading">
    <span class="page-title font-weight-bold font-italic">{{ title }}</span>
    <a routerLink="/exercise-create">
      <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
    </a>
  </section>
  <table class="table table-striped table-hover">
    <thead>
      <th>Id</th>
      <th>User</th>
      <th>Activity</th>
      <th>Week</th>
      <th>DOW</th>
      <th>Date</th>
      <th>Miles</th>
    </thead>
    <tbody>
      @for (e of exercises; track $index) {
      <tr>
        <td>{{ e.id }}</td>
        <td>{{ e.user.email }}</td>
        <td>{{ e.activity.name }}</td>
        <td>{{ e.week.weekNumber }}</td>
        <td>{{ e.exerciseDate | date:'EEE' }}</td>
        <td>{{ e.exerciseDate }}</td>
        <td>{{ e.miles }}</td>
        <td>
          <a routerLink="/exercise-detail/{{ e.id }}">
            <img
              src="assets/details.png"
              width="20"
              height="20"
              title="Exercise Details"
            />
          </a>
          |
          <a routerLink="/exercise-edit/{{ e.id }}">
            <img
              src="assets/pencil-icon.png"
              width="20"
              height="20"
              title="Edit Exercise"
            />
          </a>
          |
          <a>
            <img
              src="assets/delete.jpg"
              width="20"
              height="20"
              title="Delete Exercise"
              (click)="delete(e.id)"
            />
          </a>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
