<app-menu></app-menu>
<div class="container">
  <section class="sticky-top z-3 pt-5 pb-2">
    <div class="d-flex align-items-center justify-content-between">
      {{ title }}
      <a routerLink="/exercise-create">
        <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
      </a>
    </div>
  </section>
  <table class="table table-striped table-hover">
    <thead class="thead-sticky">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">User</th>
        <th scope="col">Activity</th>
        <th scope="col">Week</th>
        <th scope="col">DOW</th>
        <th scope="col">Date</th>
        <th scope="col">Miles</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
      @for (e of exercises; track $index) {
      <tr>
        <td>{{ e.id }}</td>
        <td>{{ e.user.email }}</td>
        <td>{{ e.activity.name }}</td>
        <td>{{ e.week.weekNumber }}</td>
        <td>{{ e.exerciseDate | date : "EEE" }}</td>
        <td>{{ e.exerciseDate }}</td>
        <td>{{ e.miles }}</td>
        <td>
          <a routerLink="/exercise-detail/{{ e.id }}">
            <img
              src="assets/details.png"
              width="20"
              height="20"
              title="Exercise Details"
            />
          </a>
          |
          <a routerLink="/exercise-edit/{{ e.id }}">
            <img
              src="assets/pencil-icon.png"
              width="20"
              height="20"
              title="Edit Exercise"
            />
          </a>
          |
          <a>
            <img
              src="assets/delete.jpg"
              width="20"
              height="20"
              title="Delete Exercise"
              (click)="delete(e.id)"
            />
          </a>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
