<app-menu></app-menu>
<div class="p-4 container mt-5">
  <section class="heading">
    <span class="page-title font-weight-bold font-italic">{{ title }}</span>
    <a routerLink="/activity-create">
      <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
    </a>
  </section>
  <table class="table table-striped table-hover">
    <thead>
      <th>Id</th>
      <th>Name</th>
    </thead>
    <tbody>
      @for (a of activities; track $index) {
      <tr>
        <td>{{ a.id }}</td>
        <td>{{ a.name }}</td>
        <td>
          <a routerLink="/activity-detail/{{ a.id }}">
            <img
              src="assets/details.png"
              width="20"
              height="20"
              title="Activity Details"
            />
          </a>
          |
          <a routerLink="/activity-edit/{{ a.id }}">
            <img
              src="assets/pencil-icon.png"
              width="20"
              height="20"
              title="Edit Activity"
            />
          </a>
          |
          <a>
            <img
              src="assets/delete.jpg"
              width="20"
              height="20"
              title="Delete Activity"
              (click)="delete(a.id)"
            />
          </a>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
