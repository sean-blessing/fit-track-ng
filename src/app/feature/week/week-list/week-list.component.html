<app-menu></app-menu>
<div class="p-4">
  <section class="heading">
    <span class="page-title font-weight-bold font-italic">{{ title }}</span>
    @if(enabled) {
    <a routerLink="/week-create">
      <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
    </a>
    } 
  </section>
  <table class="table table-striped table-hover">
    <thead>
      <th>Id</th>
      <th>Year</th>
      <th>WeekNumber</th>
      <th>StartDate</th>
      <th>EndDate</th>
    </thead>
    <tbody>
      @for (w of weeks; track $index) {
      <tr>
        <td>{{ w.id }}</td>
        <td>{{ w.year }}</td>
        <td>{{ w.weekNumber }}</td>
        <td>{{ w.startDate }}</td>
        <td>{{ w.endDate }}</td>
        <td>
          <a routerLink="/week-detail/{{ w.id }}">
            <img
              src="assets/details.png"
              width="20"
              height="20"
              title="Week Details"
            />
          </a>
          |
          <a routerLink="/week-edit/{{ w.id }}">
            <img
              src="assets/pencil-icon.png"
              width="20"
              height="20"
              title="Edit Week"
            />
          </a>
          @if(enabled) { |
          <a>
            <img
              src="assets/delete.jpg"
              width="20"
              height="20"
              title="Delete Week"
              (click)="delete(w.id)"
            />
          </a>
          }
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
