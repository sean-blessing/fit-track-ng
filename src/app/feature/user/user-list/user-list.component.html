<app-menu></app-menu>
<div class="p-4 container mt-5">
    <section class="heading">
      <span class="page-title font-weight-bold font-italic">{{ title }}</span>
      <a routerLink="/user-create">
        <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
      </a>
    </section>
    @if (users === null) {
      <p>Loading...</p>
    }
    @else {
      <table class="table table-striped table-hover">
        <thead>
          <th>Id</th>
          <th>Email</th>
          <th>FirstName</th>
          <th>LastName</th>
          <th>Action</th>
        </thead>
        <tbody>
          @for (u of users; track $index) {
          <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.firstName }}</td>
            <td>{{ u.lastName }}</td>
            <td>
              <a routerLink="/user-detail/{{ u.id }}">
                <img
                  src="assets/details.png"
                  width="20"
                  height="20"
                  title="Activity Details"
                />
              </a> | 
              <a routerLink="/user-edit/{{ u.id }}">
                <img
                  src="assets/pencil-icon.png"
                  width="20"
                  height="20"
                  title="Edit User"
                />
              </a> | 
              <a>
                <img
                  src="assets/delete.jpg"
                  width="20"
                  height="20"
                  title="Delete User"
                  (click)="delete(u.id)"
                />
              </a>
            </td>
          </tr>
        }
        </tbody>
      </table>
    }
  </div>
